name: Build Veltrax Studios for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-windows-

      - name: Install npm dependencies
        run: npm install

      - name: Remove stale cached NSIS installers
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsis) {
            Remove-Item -Path $nsis -Recurse -Force
          }

      - name: Build Tauri app (Windows)
        run: npm run tauri build

      - name: Verify current installer exists
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/Veltrax Studios_1.0.0_x64-setup.exe"
          if (-not (Test-Path $installer -PathType Leaf)) {
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -ErrorAction SilentlyContinue
            throw "Expected installer not found: $installer"
          }

      - name: Upload only Veltrax Studios 1.0.0 Setup
        uses: actions/upload-artifact@v4
        with:
          name: Veltrax-Studios-1.0-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/Veltrax Studios_1.0.0_x64-setup.exe
          if-no-files-found: error
          retention-days: 30
