[package]
name = "vexel"
version = "0.1.0"
description = "Vexel — Fast desktop image editor by Crafters Apex"
authors = ["Crafters Apex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tokio = { version = "1", features = ["full"] }
