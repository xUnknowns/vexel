version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build-windows:
    executor:
      name: win/default
      size: large
    steps:
      - checkout

      - run:
          name: Ensure Node.js LTS is installed
          shell: powershell.exe
          command: |
            if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              choco install nodejs-lts -y
            }
            node -v
            npm -v

      - run:
          name: Install Rust toolchain
          shell: powershell.exe
          command: |
            if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
              Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable
              Remove-Item rustup-init.exe
            }
            $cargoBin = "$env:USERPROFILE\.cargo\bin"
            [Environment]::SetEnvironmentVariable("Path", "$cargoBin;" + $env:Path, [EnvironmentVariableTarget]::Machine)
            & "$cargoBin\rustc.exe" --version
            & "$cargoBin\cargo.exe" --version

      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "src-tauri/Cargo.toml" }}
            - cargo-v1-

      - run:
          name: Install npm dependencies
          shell: powershell.exe
          command: npm install

      - run:
          name: Build Tauri Windows bundle
          shell: powershell.exe
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;" + $env:Path
            npm run tauri build

      - save_cache:
          key: cargo-v1-{{ checksum "src-tauri/Cargo.toml" }}
          paths:
            - ~/.cargo

      - store_artifacts:
          path: src-tauri/target/release/bundle
          destination: vexel-windows-bundle

workflows:
  build:
    jobs:
      - build-windows
