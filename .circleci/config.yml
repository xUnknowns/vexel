version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build-windows:
    executor:
      name: win/default
      size: large
    environment:
      CARGO_HOME: C:\Users\circleci\.cargo
      RUSTUP_HOME: C:\Users\circleci\.rustup

    steps:
      - checkout

      - run:
          name: Install Node.js LTS
          shell: powershell.exe
          command: |
            if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              choco install nodejs-lts -y --no-progress
            }
            node -v
            npm -v

      - run:
          name: Install Rust toolchain (rustup)
          shell: powershell.exe
          command: |
            if (-not (Test-Path "$env:CARGO_HOME\bin\cargo.exe")) {
              Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable --profile minimal --no-modify-path
              Remove-Item rustup-init.exe
            }

      - run:
          name: Verify Rust install
          shell: powershell.exe
          command: |
            $env:Path = "$env:CARGO_HOME\bin;" + $env:Path
            rustc --version
            cargo --version

      - restore_cache:
          keys:
            - cargo-registry-v1-{{ checksum "src-tauri/Cargo.toml" }}
            - cargo-registry-v1-

      - run:
          name: Install npm dependencies
          shell: powershell.exe
          command: npm ci

      - run:
          name: Build Tauri Windows bundle
          shell: powershell.exe
          command: |
            $env:Path = "$env:CARGO_HOME\bin;" + $env:Path
            npm run tauri build

      - save_cache:
          key: cargo-registry-v1-{{ checksum "src-tauri/Cargo.toml" }}
          paths:
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.cargo\git

      - store_artifacts:
          path: src-tauri/target/release/bundle
          destination: vexel-windows-bundle

workflows:
  build:
    jobs:
      - build-windows
